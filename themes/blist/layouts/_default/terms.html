{{ define "main" }}

  <h1 class="container px-6 pt-6 mx-auto text-3xl font-bold">{{ .Title }}</h1>

  <div class="container p-6 mx-auto">
    <div class="flex flex-wrap gap-3">
      {{ range .Data.Terms.ByCount }}
        <a href="{{ .Page.Permalink }}" 
           class="inline-flex items-center px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
          <span class="font-medium">{{ .Page.Title }}</span>
          <span class="ml-2 px-2 py-0.5 text-xs rounded-full bg-gray-200 dark:bg-gray-600">
            {{ .Count }}
          </span>
        </a>
      {{ end }}
    </div>
  </div>
  
  {{- partial "social.html" . -}}
{{ end }}
