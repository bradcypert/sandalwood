baseURL = 'https://www.bradcypert.com/'
languageCode = 'en-us'
title = 'BradCypert.com'
theme = 'blist'
timeout = 60000

enableGitInfo = true

[taxonomies]
  series = 'series'
  tag = 'tags'

[params]
  images = [
    "profile.png"
  ]

  description = 'Systems programming in public — Zig, Gleam, Go, Rust, and whatever Brad Cypert is learning this month.'

  # Enable the darkmode toggle in header
  darkModeToggle = true
  
  # Enable search in header
  enableSearch = true

  # Custom copyright - optional
  # Copyright year is rendered from the current date in layouts/partials/footer.html
  favicon = "/favicon.svg"

  # Color for the intro details and social links block, not applicable for dark mode
  # Supported values: Any color from TailwindCSS default colors
  # Reference: https://tailwindcss.com/docs/customizing-colors
  ascentColor = "bg-yellow-50"

  # The page bundle that is shown on the front page
  frontBundle = "blog"

  # Used to hide the post metadata such as posted date, reading time and word count
  # Can be used at site level or page level
  hideMeta = false

  # To hide "Other languages" option if the post is available in multiple languages
  # Can be used at site level or page level
  hideOtherLanguages = false

  introTitle = "Hey! I'm Brad Cypert."
  introSubtitle = "I write systems code in public — Zig, Gleam, and whatever I'm learning this month."
  introBio = "Who am I?<br>I'm a programming language enthusiast. Sometimes I <a class=\"text-pink-900 dark:text-pink-200\" href=\"/blog\">write</a>. Sometimes I post content on <a class=\"text-pink-900 dark:text-pink-200\" href=\"https://www.youtube.com/@CodeWithCypert\">my YouTube channel, CodeWithCypert</a>."
  introPhoto = "/brad-w-luna.jpg"

  author = "Brad Cypert"
  logo = "/brad-w-luna.jpg"
  header = "Brad Cypert"
  twitter = "bradcypert"
  github = "bradcypert"

DefaultContentLanguage = "en"
DefaultContentLanguageInSubdir = true

[[menu.main]]
  name = "Blog"
  url = "blog"
  weight = 1

[[menu.main]]
  name = "About"
  url = "about"
  weight = 2

[[menu.main]]
  name = "Tags"
  url = "tags"
  weight = 3

[permalinks]
  blog = '/:contentbasename/'
  page = '/:contentbasename/'

[params.homepage.social]
  # Global params common for both languages
  title = "Follow me"
  description = "Connect with me to follow along on my journey in my career, open source, and mentorship. Occasionally, I'll share good advice and content (quality not guaranteed)."
  twitter = "https://twitter.com/bradcypert"
  linkedin = "https://linkedin.com/in/bradcypert"
  github = "https://github.com/bradcypert"
  youtube = "https://www.youtube.com/@CodeWithCypert"

[build]
  writeStats = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

# syntax highlight settings
[markup]
  [markup.highlight]
    style = "dracula"
  [markup.goldmark.renderer]
    # Enable to include inline HTML
    unsafe = true
  [markup.goldmark.extensions]
    definitionList = true
    footnote = true
    linkify = true
    linkifyProtocol = 'https'
    strikethrough = true
    table = true
    taskList = true
    typographer = false

